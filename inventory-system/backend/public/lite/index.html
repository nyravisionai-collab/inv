<!DOCTYPE html>
<!--
  Inventory Lite — a deliberately old-browser-friendly client.

  Written in plain ES5 with XMLHttpRequest so it works on Windows Phone
  (Internet Explorer Mobile 11 / old Edge), feature phones with IE-class
  browsers, and any other device too old to run the React app. No build
  step, no dependencies: one file, served by the backend at /lite/.

  Modern browsers never see this — frontend/index.html redirects
  module-incapable browsers here automatically.
-->
<html lang="gu">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory Lite</title>
<style>
/* Windows Phone 8.1 IE needs the CSS viewport rule, not just the meta tag. */
@-ms-viewport { width: device-width; }
@viewport { width: device-width; }

/* Gujarati font bundled so phones without an Indic font still render text. */
@font-face {
  font-family: 'NotoGuj';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/noto-sans-gujarati-latin-400-normal.woff2') format('woff2'),
       url('fonts/noto-sans-gujarati-latin-400-normal.woff') format('woff');
  unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF;
}
@font-face {
  font-family: 'NotoGuj';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/noto-sans-gujarati-gujarati-400-normal.woff2') format('woff2'),
       url('fonts/noto-sans-gujarati-gujarati-400-normal.woff') format('woff');
  unicode-range: U+0964-0965, U+0A80-0AFF, U+200C-200D, U+20B9;
}
@font-face {
  font-family: 'NotoGuj';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/noto-sans-gujarati-latin-700-normal.woff2') format('woff2'),
       url('fonts/noto-sans-gujarati-latin-700-normal.woff') format('woff');
  unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF;
}
@font-face {
  font-family: 'NotoGuj';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/noto-sans-gujarati-gujarati-700-normal.woff2') format('woff2'),
       url('fonts/noto-sans-gujarati-gujarati-700-normal.woff') format('woff');
  unicode-range: U+0964-0965, U+0A80-0AFF, U+200C-200D, U+20B9;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'NotoGuj', 'Nirmala UI', 'Segoe UI', Arial, sans-serif;
  background: #eef1f5;
  color: #212121;
  font-size: 15px;
  line-height: 1.45;
}

/* Header */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: #1976d2; color: #fff; z-index: 20;
  overflow: hidden;
}
#hTitle { float: left; padding: 12px 10px; font-size: 17px; font-weight: bold; }
#hLang {
  float: right; margin: 8px; padding: 7px 12px;
  background: #fff; color: #1976d2; border: 0; border-radius: 4px;
  font-size: 14px; font-weight: bold; min-height: 32px;
}

#view { padding: 56px 8px 68px; max-width: 700px; margin: 0 auto; }

/* Bottom tab bar (floats, not flex — old IE-safe) */
#tabs {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: #fff; border-top: 1px solid #ccc; z-index: 20;
  overflow: hidden;
}
.tabbtn {
  float: left; width: 20%; height: 56px; padding: 6px 0;
  background: #fff; border: 0; border-top: 3px solid #fff;
  color: #666; font-size: 13px; text-align: center;
  font-family: inherit;
}
.tabbtn.on { color: #1976d2; font-weight: bold; border-top-color: #1976d2; }

/* Shared blocks */
.card {
  background: #fff; border: 1px solid #ddd; border-radius: 6px;
  padding: 10px; margin-bottom: 8px; overflow: hidden;
}
.cardh { font-weight: bold; font-size: 15px; margin-bottom: 8px; color: #333; }
.muted { color: #777; font-size: 13px; }
.nowrap { white-space: nowrap; }

.kpis { overflow: hidden; margin: 0 -4px; }
.kpi { float: left; width: 50%; padding: 0 4px 8px; }
.kpiin {
  background: #fff; border: 1px solid #ddd; border-radius: 6px;
  padding: 10px; text-align: center;
}
.kpival { font-size: 19px; font-weight: bold; color: #1976d2; }
.kpival.green { color: #2e7d32; }
.kpival.orange { color: #ef6c00; }
.kpilbl { color: #666; font-size: 13px; }

.row {
  background: #fff; border: 1px solid #ddd; border-radius: 6px;
  padding: 10px; margin-bottom: 6px; overflow: hidden;
}
.rowl { float: left; max-width: 100%; }
.rowr { float: right; text-align: right; margin-left: 8px; }
.bigname { font-weight: bold; font-size: 15px; }
.chip {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 12px; color: #fff;
}
.chip.green { background: #2e7d32; }
.chip.orange { background: #ef6c00; }
.chip.red { background: #c62828; }
.lowstock .bigname { color: #c62828; }

/* Forms */
input, select {
  display: block; width: 100%; padding: 11px 10px; margin-bottom: 8px;
  font-size: 16px; font-family: inherit;
  border: 1px solid #aaa; border-radius: 6px; background: #fff;
}
label.fld { display: block; font-size: 13px; color: #555; margin-bottom: 2px; }

.btn {
  display: block; width: 100%; padding: 13px; margin-top: 8px;
  background: #1976d2; color: #fff; border: 0; border-radius: 6px;
  font-size: 16px; font-weight: bold; font-family: inherit; text-align: center;
}
.btn.green { background: #2e7d32; }
.btn.grey { background: #eceff1; color: #37474f; }
.btn.small { width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0; }
.qbtn {
  width: 44px; height: 40px; font-size: 20px; line-height: 1;
  background: #eceff1; color: #1565c0; border: 1px solid #b0bec5;
  border-radius: 6px; font-weight: bold;
}
.qinput { width: 70px; margin-bottom: 0; text-align: center; padding: 8px 4px; }
.qcell { float: left; margin-right: 6px; }
.qcell input { margin-bottom: 0; }

hr.sp { border: 0; border-top: 1px dashed #ccc; margin: 10px 0; }

/* Toast */
#toast {
  display: none; position: fixed; top: 52px; left: 8px; right: 8px;
  max-width: 684px; margin: 0 auto; padding: 12px; border-radius: 6px;
  color: #fff; z-index: 50; font-size: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#toast.ok { background: #2e7d32; }
#toast.err { background: #c62828; }

.center { text-align: center; }
.pad { padding: 20px 10px; }
</style>
</head>
<body>
<div id="hdr">
  <span id="hTitle">ઇન્વેન્ટરી લાઇટ</span>
  <button id="hLang" type="button" onclick="Lite.toggleLang()">EN</button>
</div>

<div id="view"><div class="center pad muted">…</div></div>

<div id="tabs">
  <button type="button" class="tabbtn on" id="tb_home"  onclick="Lite.go('home')">મુખ્ય</button>
  <button type="button" class="tabbtn"    id="tb_sale"  onclick="Lite.go('sale')">વેચાણ</button>

<noscript>

    આ એપ્લિકેશન માટે JavaScript જરૂરી છે.<br />This app requires JavaScript.
  </div>
</noscript>

<script>
/* ===================================================================

 * classList: every browser back to IE11-era phones can run this file.
 * All DOM updates go through innerHTML on dedicated containers so an
 * open <input> is never blown away mid-typing.
 * =================================================================== */
(function () {
  'use strict';

  /* --------------------------- translations --------------------------- */
  var STR = {
    gu: {

      tabHome: 'મુખ્ય', tabSale: 'વેચાણ', tabStock: 'માલ', tabItem: 'નવું', tabBills: 'બીલ',
      todaySales: 'આજનું વેચાણ', billsCount: 'બીલ', cash: 'રોકડ', profit: 'આજનો નફો',

      refresh: 'રિફ્રેશ', loading: 'લોડ થાય છે…', retry: 'ફરી પ્રયાસ કરો',
      netError: 'સર્વર સાથે જોડાણ નથી. નેટવર્ક ચેક કરી ફરી પ્રયાસ કરો.',

      avail: 'ઉપલબ્ધ', addTap: 'ઉમેરવા ટેપ કરો', cart: 'કાર્ટ', emptyCart: 'કાર્ટ ખાલી છે',
      qty: 'નંગ', price: 'ભાવ', total: 'કુલ', discount: 'ડિસ્કાઉન્ટ (₹)',
      payMode: 'ચુકવણી', cashM: 'રોકડ', creditM: 'ઉધાર (બાકી)',
      makeBill: 'બીલ બનાવો', billSaved: 'બીલ બન્યું', saving: 'સાચવી રહ્યા છીએ…',
      noData: 'કંઈ મળ્યું નહીં', adjustTitle: 'સ્ટોક સરભર', current: 'હાલ સ્ટોક',
      direction: 'પ્રકાર', dirIn: 'અંદર (+)', dirOut: 'બહાર (−)',
      reason: 'કારણ', rPurchase: 'ખરીદી', rDamage: 'નુકસાન / ખરાબ', rCorrection: 'સુધારો', rOther: 'બીજું',
      save: 'સાચવો', saved: 'સાચવ્યું', qtyErr: 'યોગ્ય નંગ નાખો', qtyNeg: 'સ્ટોક ઋણ ન થઈ શકે',

      openStock: 'શરૂઆતનો સ્ટોક', unit: 'એકમ', gst: 'GST %', minStock: 'લઘુત્તમ સ્ટોક (એલર્ટ)',
      sku: 'SKU / બારકોડ (ઓપ્શનલ)', nameReq: 'નામ જરૂરી છે', itemCreated: 'વસ્તુ ઉમેરાઈ',
      recentBills: 'તાજેતરના બીલ', more: 'વધુ બતાવો…', back: '‹ પાછા',
      paidL: 'ચૂકવેલ', partialL: 'અધૂરું', unpaidL: 'બાકી', grandL: 'ગ્રાન્ડ કુલ',
      paidAmtL: 'ચૂકવેલ રકમ', balL: 'બાકી રકમ', subtotalL: 'ઉપ-કુલ', taxL: 'GST',
      custL: 'ગ્રાહક', perUnit: 'દર',
      eStock: 'સ્ટોક પૂરતો નથી', ePay: 'ચૂકવેલ રકમ કુલ કરતાં વધુ છે',
      eEmpty: 'આઇટમ ઉમેરો', eNotFound: 'રેકોર્ડ મળ્યો નહીં', eDisc: 'ડિસ્કાઉન્ટ યોગ્ય નથી'
    },
    en: {
      appName: 'Inventory Lite',
      tabHome: 'Home', tabSale: 'Sale', tabStock: 'Stock', tabItem: 'New', tabBills: 'Bills',
      todaySales: "Today's sales", billsCount: 'bills', cash: 'Cash in hand', profit: "Today's profit",
      stockValue: 'Stock value', lowStock: 'Low stock', noLow: 'All items well stocked',
      refresh: 'Refresh', loading: 'Loading…', retry: 'Try again',
      netError: 'Cannot reach the server. Check the network and retry.',
      searchPh: 'Search item (name / SKU / barcode)…',
      avail: 'In stock', addTap: 'Tap to add', cart: 'Cart', emptyCart: 'Cart is empty',
      qty: 'Qty', price: 'Price', total: 'Total', discount: 'Discount (₹)',
      payMode: 'Payment', cashM: 'Cash', creditM: 'Credit (due)',
      makeBill: 'Save bill', billSaved: 'Bill saved', saving: 'Saving…',
      noData: 'Nothing found', adjustTitle: 'Stock adjust', current: 'Current stock',
      direction: 'Direction', dirIn: 'Stock in (+)', dirOut: 'Stock out (−)',
      reason: 'Reason', rPurchase: 'Purchase', rDamage: 'Damaged / lost', rCorrection: 'Correction', rOther: 'Other',
      save: 'Save', saved: 'Saved', qtyErr: 'Enter a valid quantity', qtyNeg: 'Stock cannot go negative',
      name: 'Item name *', sellPrice: 'Selling price (₹)', buyPrice: 'Purchase price (₹)',
      openStock: 'Opening stock', unit: 'Unit', gst: 'GST %', minStock: 'Min stock (alert)',
      sku: 'SKU / barcode (optional)', nameReq: 'Name is required', itemCreated: 'Item added',
      recentBills: 'Recent bills', more: 'Show more…', back: '‹ Back',
      paidL: 'Paid', partialL: 'Partial', unpaidL: 'Due', grandL: 'Grand total',
      paidAmtL: 'Paid', balL: 'Balance', subtotalL: 'Subtotal', taxL: 'GST',
      custL: 'Customer', perUnit: 'rate',
      eStock: 'Not enough stock', ePay: 'Paid amount exceeds total',
      eEmpty: 'Add an item first', eNotFound: 'Record not found', eDisc: 'Invalid discount'
    }
  };

  /* ----------------------------- state ------------------------------ */
  var S = {
    lang: 'gu',
    tab: 'home',
    dash: null, dashErr: false,
    saleQ: '', saleRes: [], saleTimer: null, cart: [],
    stockQ: '', stockRes: [], stockTimer: null,
    adjust: null,
    units: null, unitsLoading: false,
    billsPage: 1, billsPages: 1, bills: [], bill: null, billsLoaded: false,
    busy: false
  };

  try {
    var savedLang = window.localStorage.getItem('lite_lang');
    if (savedLang === 'en' || savedLang === 'gu') S.lang = savedLang;
  } catch (e0) { /* private mode etc. */ }

  function t(k) {
    var p = STR[S.lang] || STR.en;
    return p[k] || STR.en[k] || k;
  }

  /* --------------------------- DOM helpers -------------------------- */
  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function val(id) { var el = $(id); return el ? el.value : ''; }
  function selVal(id) { var el = $(id); return el ? el.value : ''; }
  function trim(s) { return String(s || '').replace(/^\s+|\s+$/g, ''); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function round2(n) { return Math.round(num(n) * 100) / 100; }

  /** Indian-style grouping: 1,23,456.78 */
  function fmt(n) {
    n = round2(n);
    var neg = n < 0;
    var parts = Math.abs(n).toFixed(2).split('.');
    var intp = parts[0];
    var last3 = intp.slice(-3);
    var rest = intp.slice(0, -3);
    if (rest) {
      rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      intp = rest + ',' + last3;
    } else {
      intp = last3;
    }
    return (neg ? '-' : '') + intp + '.' + parts[1];
  }

  function money(n) { return '₹' + fmt(n); }

  /** Server dates are YYYY-MM-DD; show DD-MM-YYYY. */
  function dstr(d) {
    if (!d) return '';
    var p = String(d).slice(0, 10).split('-');
    return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : String(d);
  }

  /* ----------------------------- toast ------------------------------ */
  var toastTimer = null;
  function toast(msg, ok) {
    var el = $('toast');
    if (!el) return;
    el.className = ok === false ? 'err' : 'ok';
    el.innerHTML = esc(msg);
    el.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }

  var ERRMAP = {
    ERR_INSUFFICIENT_STOCK: 'eStock',
    ERR_PAYMENT_RANGE: 'ePay',
    ERR_EMPTY_LIST: 'eEmpty',
    ERR_NOT_FOUND: 'eNotFound',
    ERR_DISCOUNT_RANGE: 'eDisc',
    ERR_QTY_POSITIVE: 'qtyErr',
    ERR_QTY_NEGATIVE: 'qtyNeg'
  };

  function showErr(e) {
    var code = e && e.code;
    if (code && ERRMAP[code]) { toast(t(ERRMAP[code]), false); return; }
    toast((e && e.message) || t('netError'), false);
  }

  /* ------------------------------ API ------------------------------- */
  function api(method, url, body, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    try { xhr.timeout = 20000; } catch (eT) { /* very old XHR may throw */ }
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var res = null;
      try { res = JSON.parse(xhr.responseText); } catch (eP) { /* leave null */ }
      if (xhr.status >= 200 && xhr.status < 300 && res && res.success) {
        cb(null, res.data, res);
        return;
      }
      cb({
        message: (res && res.message) || t('netError'),
        code: res && res.code,
        status: xhr.status
      });
    };
    try {
      xhr.ontimeout = function () { cb({ message: t('netError') }); };
    } catch (eO) { /* ignore */ }
    xhr.send(body ? JSON.stringify(body) : null);
  }

  /* ====================================================================
   * Money math mirrored from backend (utils/helpers.js + utils/validate.js)
   * so the phone's grand total matches the server's rupee-for-rupee —
   * required because we send paid_amount = grandTotal for cash bills.
   * ==================================================================== */
  function lineCalc(qty, price, rate, ttype) {
    var gross = round2(qty * price);
    if (ttype === 'none' || !rate) return { taxable: gross, tax: 0, total: gross };
    if (ttype === 'inclusive') {
      var txb = round2(gross / (1 + rate / 100));
      return { taxable: txb, tax: round2(gross - txb), total: gross };
    }
    var tax = round2(gross * rate / 100);
    return { taxable: gross, tax: tax, total: round2(gross + tax) };
  }

  function allocateProp(amount, bases) {
    var totalBase = 0, i;
    for (i = 0; i < bases.length; i++) totalBase += num(bases[i]);
    var target = round2(amount);
    var out = [];
    if (target <= 0 || totalBase <= 0) {
      for (i = 0; i < bases.length; i++) out.push(0);
      return out;
    }
    var allocated = 0, lastPositive = -1;
    for (i = 0; i < bases.length; i++) { if (num(bases[i]) > 0) lastPositive = i; }
    for (i = 0; i < bases.length; i++) {
      if (num(bases[i]) <= 0) { out.push(0); continue; }
      var share = (i === lastPositive)
        ? round2(target - allocated)
        : round2(target * num(bases[i]) / totalBase);
      allocated = round2(allocated + share);
      out.push(share);
    }
    return out;
  }

  /** Grand total of the current cart exactly as the server would compute. */
  function grandTotal() {
    var items = [], i;
    for (i = 0; i < S.cart.length; i++) {
      var c = S.cart[i];
      var lc = lineCalc(c.qty, c.price, num(c.rate), c.ttype);
      items.push({ ttype: c.ttype, rate: num(c.rate), taxable: lc.taxable, total: lc.total });
    }
    var disc = round2(num(val('disc')));
    var bases = [];
    for (i = 0; i < items.length; i++) {
      bases.push(items[i].ttype === 'inclusive'
        ? Math.max(0, items[i].total)
        : Math.max(0, items[i].taxable));
    }
    var alloc = allocateProp(disc, bases);
    var lineTotals = 0, taxTotal = 0;
    for (i = 0; i < items.length; i++) {
      var it = items[i], a = round2(alloc[i] || 0), tot, tax, tb;
      if (it.ttype === 'inclusive' && it.rate > 0) {
        var dg = round2(Math.max(0, it.total - a));
        tb = round2(dg / (1 + it.rate / 100));
        tax = round2(dg - tb); tot = dg;
      } else if (it.ttype === 'none' || !it.rate) {
        var base = it.ttype === 'inclusive' ? it.total : it.taxable;
        tb = round2(Math.max(0, base - a));
        tax = 0; tot = tb;
      } else {
        tb = round2(Math.max(0, it.taxable - a));
        tax = round2(tb * it.rate / 100); tot = round2(tb + tax);
      }
      lineTotals = round2(lineTotals + tot);
      taxTotal = round2(taxTotal + tax);
    }
    return Math.max(0, round2(lineTotals));
  }

  /* ------------------------------ tabs ------------------------------ */
  var TABS = ['home', 'sale', 'stock', 'item', 'bills'];

  function renderChrome() {
    $('hTitle').innerHTML = esc(t('appName'));
    $('hLang').innerHTML = S.lang === 'gu' ? 'EN' : 'ગુ';
    var labels = {
      home: t('tabHome'), sale: t('tabSale'), stock: t('tabStock'),
      item: t('tabItem'), bills: t('tabBills')
    };
    for (var i = 0; i < TABS.length; i++) {
      var id = TABS[i];
      var btn = $('tb_' + id);
      btn.className = 'tabbtn' + (S.tab === id ? ' on' : '');
      btn.innerHTML = esc(labels[id]);
    }
    document.title = t('appName');
    try {
      document.documentElement.setAttribute('lang', S.lang);
    } catch (eL) { /* ignore */ }
  }

  function render() {
    renderChrome();
    var v = $('view');
    if (S.tab === 'home') renderHome(v);
    else if (S.tab === 'sale') renderSale(v);
    else if (S.tab === 'stock') renderStock(v);
    else if (S.tab === 'item') renderItem(v);
    else renderBills(v);
  }

  function go(tab) {
    S.tab = tab;
    if (tab === 'home') loadHome();
    else if (tab === 'sale') { render(); if (S.saleQ) loadSaleResults(); }
    else if (tab === 'stock') { render(); loadStockList(); }
    else if (tab === 'item') {
      render();
      if (!S.units && !S.unitsLoading) loadUnits(function () {
        if (S.tab === 'item') renderItem($('view'));
      });
    }
    else if (tab === 'bills') {
      S.bill = null;
      render();
      loadBills(1, false);
    }
    else render();
  }

  /* ------------------------------ HOME ------------------------------ */
  function loadHome() {
    S.dashErr = false;
    render();
    api('GET', '/api/dashboard', null, function (err, data) {
      if (S.tab !== 'home') return;
      if (err) { S.dashErr = true; S.dash = null; render(); return; }
      S.dash = data; render();
    });
  }

  function renderHome(v) {
    if (S.dashErr) {
      v.innerHTML = '<div class="card center pad">' + esc(t('netError')) +
        '<button type="button" class="btn" onclick="Lite.go(\'home\')">' + esc(t('retry')) + '</button></div>';
      return;
    }
    if (!S.dash) {
      v.innerHTML = '<div class="center pad muted">' + esc(t('loading')) + '</div>';
      return;
    }
    var d = S.dash;
    var h = '<div class="kpis">'
      + kpi(money(d.todaySales), t('todaySales') + ' · ' + (d.todaySalesCount || 0) + ' ' + t('billsCount'), '')
      + kpi(money(d.cashInHand), t('cash'), 'green')
      + kpi(money(d.profit), t('profit'), num(d.profit) >= 0 ? 'green' : 'orange')
      + kpi(money(d.stockValue), t('stockValue'), '')
      + '</div>';

    h += '<div class="cardh">' + esc(t('lowStock'))
      + ' <span class="muted">(' + (d.lowStockCount || 0) + ')</span></div>';
    if (!d.lowStock || !d.lowStock.length) {
      h += '<div class="card muted">' + esc(t('noLow')) + '</div>';
    } else {
      for (var i = 0; i < d.lowStock.length; i++) {
        var p = d.lowStock[i];
        h += '<div class="row lowstock" onclick="Lite.openAdjust(' + Number(p.id) + ')">'
          + '<div class="rowl"><div class="bigname">' + esc(p.name) + '</div>'
          + '<div class="muted">' + esc(t('avail')) + ': ' + esc(fmt(p.current_stock))
          + ' / min ' + esc(fmt(p.min_stock)) + '</div></div>'
          + '<div class="rowr"><span class="chip red">' + esc(fmt(p.current_stock)) + '</span></div>'
          + '</div>';
      }
    }
    h += '<button type="button" class="btn grey" onclick="Lite.go(\'home\')">↻ ' + esc(t('refresh')) + '</button>';
    v.innerHTML = h;
  }

  function kpi(value, label, cls) {
    return '<div class="kpi"><div class="kpiin">'
      + '<div class="kpival ' + (cls || '') + '">' + esc(value) + '</div>'
      + '<div class="kpilbl">' + esc(label) + '</div></div></div>';
  }

  /* ------------------------------ SALE ------------------------------ */
  function renderSale(v) {
    var h = '<div class="card">'
      + '<input type="text" id="sale_q" autocomplete="off" placeholder="' + esc(t('searchPh')) + '"'
      + ' value="' + esc(S.saleQ) + '" onkeyup="Lite.saleKey(this)" />'
      + '<div id="sale_results"></div></div>'
      + '<div class="cardh">' + esc(t('cart')) + '</div>'
      + '<div id="cartBox"></div>'
      + '<div class="card">'
      + '<label class="fld" for="disc">' + esc(t('discount')) + '</label>'
      + '<input type="number" id="disc" step="any" min="0" value="0" onchange="Lite.renderCart()" />'
      + '<label class="fld" for="paymode">' + esc(t('payMode')) + '</label>'
      + '<select id="paymode"><option value="cash">' + esc(t('cashM')) + '</option>'
      + '<option value="credit">' + esc(t('creditM')) + '</option></select>'
      + '<div id="gtotal" class="center"></div>'
      + '<button type="button" id="btn_save_sale" class="btn green" onclick="Lite.saveSale()"></button>'
      + '</div>';
    v.innerHTML = h;
    renderSaleResults();
    renderCart();
  }

  function saleKey(el) {
    S.saleQ = el.value;
    if (S.saleTimer) clearTimeout(S.saleTimer);
    S.saleTimer = setTimeout(loadSaleResults, 250);
  }

  function loadSaleResults() {
    var q = trim(S.saleQ);
    if (!q) { S.saleRes = []; renderSaleResults(); return; }
    api('GET', '/api/products?limit=12&search=' + encodeURIComponent(q), null, function (err, data) {
      if (err) { showErr(err); return; }
      S.saleRes = (data && data.length) ? data : [];
      renderSaleResults();
    });
  }

  function renderSaleResults() {
    var box = $('sale_results');
    if (!box) return;
    if (!S.saleRes.length) { box.innerHTML = ''; return; }
    var h = '';
    for (var i = 0; i < S.saleRes.length; i++) {
      var p = S.saleRes[i];
      h += '<div class="row" onclick="Lite.cartAdd(' + Number(p.id) + ')">'
        + '<div class="rowl"><div class="bigname">' + esc(p.name) + '</div>'
        + '<div class="muted">' + money(p.selling_price) + ' · ' + esc(t('avail')) + ': '
        + esc(fmt(p.current_stock)) + ' ' + esc(p.unit_short || '') + '</div></div>'
        + '<div class="rowr"><span class="chip green">+ ' + esc(t('addTap')) + '</span></div>'
        + '</div>';
    }
    box.innerHTML = h;
  }

  function findSaleProduct(pid) {
    for (var i = 0; i < S.saleRes.length; i++) if (Number(S.saleRes[i].id) === Number(pid)) return S.saleRes[i];
    return null;
  }

  function cartFind(pid) {
    for (var i = 0; i < S.cart.length; i++) if (Number(S.cart[i].pid) === Number(pid)) return i;
    return -1;
  }

  function renderCart() {
    var box = $('cartBox');
    if (!box) return;
    if (!S.cart.length) {
      box.innerHTML = '<div class="card muted">' + esc(t('emptyCart')) + '</div>';
      updateTotalButton();
      return;
    }
    var h = '';
    for (var i = 0; i < S.cart.length; i++) {
      var c = S.cart[i];
      var lc = lineCalc(c.qty, c.price, num(c.rate), c.ttype);
      h += '<div class="row">'
        + '<div class="bigname">' + esc(c.name) + '</div>'
        + '<div class="muted">' + money(c.price) + ' × ' + esc(fmt(c.qty)) + ' '
        + esc(c.unit || '') + ' = <b>' + money(lc.total) + '</b></div>'
        + '<div class="qcell"><button type="button" class="qbtn" onclick="Lite.cartQty(' + i + ',-1)">−</button></div>'
        + '<div class="qcell"><input type="number" class="qinput" step="any" value="' + esc(c.qty) + '" onchange="Lite.cartQtySet(' + i + ',this.value)" /></div>'
        + '<div class="qcell"><button type="button" class="qbtn" onclick="Lite.cartQty(' + i + ',1)">+</button></div>'
        + '<div class="qcell"><input type="number" class="qinput" step="any" value="' + esc(c.price) + '" onchange="Lite.cartPriceSet(' + i + ',this.value)" title="' + esc(t('price')) + '" /></div>'
        + '<div class="qcell"><button type="button" class="qbtn" onclick="Lite.cartDel(' + i + ')">×</button></div>'
        + '</div>';
    }
    box.innerHTML = h;
    updateTotalButton();
  }

  function updateTotalButton() {
    var g = grandTotal();
    var gt = $('gtotal');
    var btn = $('btn_save_sale');
    var label = t('total') + ': ' + money(g);
    if (gt) gt.innerHTML = '<hr class="sp" /><b style="font-size:19px;">' + esc(label) + '</b><hr class="sp" />';
    if (btn) {
      btn.innerHTML = esc(t('makeBill') + (S.cart.length ? ' — ' + money(g) : ''));
      btn.disabled = !S.cart.length;
      btn.style.background = S.cart.length ? '' : '#9e9e9e';
    }
  }

  /* --------------------------- STOCK tab ---------------------------- */
  function renderStock(v) {
    var h = '<div id="adjbox"></div>'
      + '<div class="card">'
      + '<input type="text" id="stock_q" autocomplete="off" placeholder="' + esc(t('searchPh')) + '"'
      + ' value="' + esc(S.stockQ) + '" onkeyup="Lite.stockKey(this)" />'
      + '</div>'
      + '<div id="stock_results"><div class="center pad muted">' + esc(t('loading')) + '</div></div>';
    v.innerHTML = h;
    renderAdjBox();
  }

  function stockKey(el) {
    S.stockQ = el.value;
    if (S.stockTimer) clearTimeout(S.stockTimer);
    S.stockTimer = setTimeout(loadStockList, 250);
  }

  function loadStockList() {
    var q = trim(S.stockQ);
    var url = '/api/products?limit=20' + (q ? '&search=' + encodeURIComponent(q) : '');
    api('GET', url, null, function (err, data) {
      if (err) { showErr(err); return; }
      S.stockRes = (data && data.length) ? data : [];
      renderStockResults();
    });
  }

  function renderStockResults() {
    var box = $('stock_results');
    if (!box) return;
    if (!S.stockRes.length) { box.innerHTML = '<div class="card muted">' + esc(t('noData')) + '</div>'; return; }
    var h = '';
    for (var i = 0; i < S.stockRes.length; i++) {
      var p = S.stockRes[i];
      var low = num(p.min_stock) > 0 && num(p.current_stock) <= num(p.min_stock);
      h += '<div class="row' + (low ? ' lowstock' : '') + '" onclick="Lite.openAdjust(' + Number(p.id) + ')">'
        + '<div class="rowl"><div class="bigname">' + esc(p.name) + '</div>'
        + '<div class="muted">' + esc(t('avail')) + ': ' + esc(fmt(p.current_stock)) + ' '
        + esc(p.unit_short || '') + (num(p.min_stock) ? ' · min ' + esc(fmt(p.min_stock)) : '') + '</div></div>'
        + '<div class="rowr"><span class="chip ' + (low ? 'red' : 'green') + '">' + esc(fmt(p.current_stock)) + '</span></div>'
        + '</div>';
    }
    box.innerHTML = h;
  }

  function renderAdjBox() {
    var box = $('adjbox');
    if (!box) return;
    var a = S.adjust;
    if (!a) { box.innerHTML = ''; return; }
    if (a.busy) { box.innerHTML = '<div class="card muted">' + esc(t('loading')) + '</div>'; return; }
    var h = '<div class="card">'
      + '<div class="cardh">' + esc(t('adjustTitle')) + ': ' + esc(a.name) + '</div>'
      + '<div class="muted">' + esc(t('current')) + ': <b>' + esc(fmt(a.cur)) + ' ' + esc(a.unit) + '</b></div>'
      + '<hr class="sp" />'
      + '<label class="fld" for="adj_dir">' + esc(t('direction')) + '</label>'
      + '<select id="adj_dir"><option value="in">' + esc(t('dirIn')) + '</option>'
      + '<option value="out">' + esc(t('dirOut')) + '</option></select>'
      + '<label class="fld" for="adj_qty">' + esc(t('qty')) + '</label>'
      + '<input type="number" id="adj_qty" step="any" min="0" value="1" />'
      + '<label class="fld" for="adj_reason">' + esc(t('reason')) + '</label>'
      + '<select id="adj_reason">'
      + '<option value="purchase">' + esc(t('rPurchase')) + '</option>'
      + '<option value="damage">' + esc(t('rDamage')) + '</option>'
      + '<option value="correction">' + esc(t('rCorrection')) + '</option>'
      + '<option value="other">' + esc(t('rOther')) + '</option></select>'
      + '<button type="button" class="btn green" onclick="Lite.saveAdjust()">' + esc(t('save')) + '</button>'
      + '<button type="button" class="btn grey" onclick="Lite.closeAdjust()">×</button>'
      + '</div>';
    box.innerHTML = h;
  }

  /* --------------------------- NEW ITEM tab ------------------------- */
  function loadUnits(cb) {
    S.unitsLoading = true;
    api('GET', '/api/units', null, function (err, data) {
      S.unitsLoading = false;
      if (!err) S.units = data || [];
      if (cb) cb(err);
    });
  }

  function renderItem(v) {
    var opts = '';
    if (S.units && S.units.length) {
      for (var i = 0; i < S.units.length; i++) {
        var u = S.units[i];
        opts += '<option value="' + Number(u.id) + '">' + esc(u.name) + (u.short_name ? ' (' + esc(u.short_name) + ')' : '') + '</option>';
      }
    } else {
      opts = '<option value="">—</option>';
    }
    var h = '<div class="card">'
      + '<div class="cardh">' + esc(t('tabItem')) + '</div>'
      + '<label class="fld" for="ni_name">' + esc(t('name')) + '</label>'
      + '<input type="text" id="ni_name" autocomplete="off" />'
      + '<label class="fld" for="ni_sell">' + esc(t('sellPrice')) + '</label>'
      + '<input type="number" id="ni_sell" step="any" min="0" />'
      + '<label class="fld" for="ni_buy">' + esc(t('buyPrice')) + '</label>'
      + '<input type="number" id="ni_buy" step="any" min="0" />'
      + '<label class="fld" for="ni_open">' + esc(t('openStock')) + '</label>'
      + '<input type="number" id="ni_open" step="any" min="0" />'
      + '<label class="fld" for="ni_unit">' + esc(t('unit')) + '</label>'
      + '<select id="ni_unit">' + opts + '</select>'
      + '<label class="fld" for="ni_gst">' + esc(t('gst')) + '</label>'
      + '<select id="ni_gst">'
      + '<option value="0">0%</option><option value="5">5%</option>'
      + '<option value="12">12%</option><option value="18" selected="selected">18%</option>'
      + '<option value="28">28%</option></select>'
      + '<label class="fld" for="ni_min">' + esc(t('minStock')) + '</label>'
      + '<input type="number" id="ni_min" step="any" min="0" />'
      + '<label class="fld" for="ni_sku">' + esc(t('sku')) + '</label>'
      + '<input type="text" id="ni_sku" autocomplete="off" />'
      + '<button type="button" class="btn green" onclick="Lite.saveItem()">' + esc(t('save')) + '</button>'
      + '</div>';
    v.innerHTML = h;
  }

  /* ---------------------------- BILLS tab --------------------------- */
  function renderBills(v) {
    if (S.bill) { renderBillDetail(v); return; }
    v.innerHTML = '<div class="cardh">' + esc(t('recentBills')) + '</div>'
      + '<div id="bills_box"><div class="center pad muted">' + esc(t('loading')) + '</div></div>'
      + '<div id="bills_more"></div>';
    if (S.billsLoaded) renderBillsList();
  }

  function loadBills(page, append) {
    api('GET', '/api/sales?type=sale,pos&limit=10&page=' + page, null, function (err, data, res) {
      if (err) {
        var box = $('bills_box');
        if (box && !append) box.innerHTML = '<div class="card muted">' + esc((err && err.message) || t('netError')) + '</div>';
        else if (err) showErr(err);
        return;
      }
      var rows = (data && data.length) ? data : [];
      S.bills = append ? S.bills.concat(rows) : rows;
      S.billsPage = page;
      S.billsPages = (res && res.pagination && res.pagination.pages) || 1;
      S.billsLoaded = true;
      renderBillsList();
    });
  }

  function renderBillsList() {
    var box = $('bills_box');
    if (!box) return;
    if (!S.bills.length) { box.innerHTML = '<div class="card muted">' + esc(t('noData')) + '</div>'; return; }
    var h = '';
    for (var i = 0; i < S.bills.length; i++) {
      var b = S.bills[i];
      var ps = String(b.payment_status || '');
      var chipCls = ps === 'paid' ? 'green' : (ps === 'partial' ? 'orange' : 'red');
      var chipTxt = ps === 'paid' ? t('paidL') : (ps === 'partial' ? t('partialL') : t('unpaidL'));
      h += '<div class="row" onclick="Lite.openBill(' + Number(b.id) + ')">'
        + '<div class="rowl"><div class="bigname">' + esc(b.invoice_number) + '</div>'
        + '<div class="muted">' + esc(dstr(b.invoice_date))
        + (b.customer_name ? ' · ' + esc(b.customer_name) : '') + '</div></div>'
        + '<div class="rowr"><div><b>' + money(b.grand_total) + '</b></div>'
        + '<span class="chip ' + chipCls + '">' + esc(chipTxt) + '</span></div>'
        + '</div>';
    }
    box.innerHTML = h;
    var mb = $('bills_more');
    if (mb) {
      mb.innerHTML = (S.billsPage < S.billsPages)
        ? '<button type="button" class="btn grey" onclick="Lite.moreBills()">' + esc(t('more')) + '</button>'
        : '';
    }
  }

  function renderBillDetail(v) {
    var s = S.bill;
    var h = '<button type="button" class="btn grey" onclick="Lite.closeBill()">' + esc(t('back')) + '</button>'
      + '<div class="card">'
      + '<div class="cardh">' + esc(s.invoice_number) + '</div>'
      + '<div class="muted">' + esc(dstr(s.invoice_date))
      + (s.customer_name ? ' · ' + esc(t('custL')) + ': ' + esc(s.customer_name) : '') + '</div>'
      + '<hr class="sp" />';
    var items = s.items || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<div>' + esc(it.product_name || '')
        + ' <span class="muted">(' + esc(fmt(it.quantity)) + ' × ' + money(it.unit_price) + ')</span>'
        + ' <b class="nowrap">' + money(it.total) + '</b></div>';
    }
    h += '<hr class="sp" />'
      + '<div>' + esc(t('subtotalL')) + ': <b class="nowrap">' + money(s.subtotal) + '</b></div>';
    if (num(s.discount_amount)) h += '<div>' + esc(t('discount')) + ': −' + money(s.discount_amount) + '</div>';
    if (num(s.tax_amount)) h += '<div>' + esc(t('taxL')) + ': ' + money(s.tax_amount) + '</div>';
    h += '<hr class="sp" />'
      + '<div style="font-size:18px;">' + esc(t('grandL')) + ': <b class="nowrap">' + money(s.grand_total) + '</b></div>'
      + '<div>' + esc(t('paidAmtL')) + ': ' + money(s.paid_amount) + '</div>';
    if (num(s.balance_amount) > 0) h += '<div style="color:#c62828;">' + esc(t('balL')) + ': ' + money(s.balance_amount) + '</div>';
    h += '</div>';
    v.innerHTML = h;
  }

  /* ------------------------- public actions ------------------------- */
  var Lite = {
    go: go,
    renderCart: renderCart,
    saleKey: saleKey,
    stockKey: stockKey,

    toggleLang: function () {
      S.lang = S.lang === 'gu' ? 'en' : 'gu';
      try { window.localStorage.setItem('lite_lang', S.lang); } catch (eS) { /* ignore */ }
      render();
      if (S.tab === 'bills' && S.billsLoaded && !S.bill) { renderBillsList(); }
    },

    cartAdd: function (pid) {
      var p = findSaleProduct(pid);
      if (!p) return;
      var i = cartFind(pid);
      if (i >= 0) {
        S.cart[i].qty = round2(S.cart[i].qty + 1);
      } else {
        S.cart.push({
          pid: Number(p.id),
          name: p.name,
          price: num(p.selling_price),
          rate: num(p.tax_rate),
          ttype: p.tax_type || 'exclusive',
          unit: p.unit_short || '',
          qty: 1
        });
      }
      renderCart();
    },

    cartQty: function (i, d) {
      if (!S.cart[i]) return;
      S.cart[i].qty = round2(S.cart[i].qty + d);
      if (S.cart[i].qty <= 0) S.cart[i].qty = 1;
      renderCart();
    },

    cartQtySet: function (i, v) {
      if (!S.cart[i]) return;
      var q = round2(num(v));
      S.cart[i].qty = q > 0 ? q : 1;
      renderCart();
    },

    cartPriceSet: function (i, v) {
      if (!S.cart[i]) return;
      S.cart[i].price = Math.max(0, round2(num(v)));
      renderCart();
    },

    cartDel: function (i) {
      S.cart.splice(i, 1);
      renderCart();
    },

    saveSale: function () {
      if (S.busy) return;
      if (!S.cart.length) { toast(t('emptyCart'), false); return; }
      var items = [];
      for (var i = 0; i < S.cart.length; i++) {
        var c = S.cart[i];
        items.push({
          product_id: c.pid,
          // The API stores the name on each line (sale_items.product_name is
          // NOT NULL), so a bill line must always carry it.
          product_name: c.name,
          quantity: c.qty,
          unit_price: c.price,
          tax_rate: num(c.rate),
          tax_type: c.ttype
        });
      }
      var grand = grandTotal();
      var body = {
        invoice_type: 'pos',
        status: 'completed',
        items: items,
        discount_type: 'amount',
        discount_value: round2(num(val('disc'))),
        payment_mode: 'cash',
        paid_amount: selVal('paymode') === 'credit' ? 0 : grand
      };
      S.busy = true;
      toast(t('saving'), true);
      api('POST', '/api/sales', body, function (err, data) {
        S.busy = false;
        if (err) { showErr(err); return; }
        toast(t('billSaved') + ': ' + (data.invoice_number || '') + ' — ' + money(data.grand_total), true);
        S.cart = [];
        var disc = $('disc'); if (disc) disc.value = '0';
        renderCart();
      });
    },

    openAdjust: function (pid) {
      var wasTab = S.tab;
      S.tab = 'stock';
      S.adjust = { pid: pid, busy: true };
      if (wasTab !== 'stock') render();
      else renderAdjBox();
      api('GET', '/api/products/' + Number(pid), null, function (err, p) {
        if (err) {
          showErr(err);
          S.adjust = null;
          renderAdjBox();
          return;
        }
        S.adjust = {
          pid: Number(p.id),
          name: p.name,
          cur: num(p.current_stock),
          unit: p.unit_short || p.unit_name || ''
        };
        renderAdjBox();
      });
    },

    closeAdjust: function () {
      S.adjust = null;
      renderAdjBox();
    },

    saveAdjust: function () {
      if (!S.adjust || S.busy) return;
      var q = num(val('adj_qty'));
      if (q <= 0) { toast(t('qtyErr'), false); return; }
      var newQty = selVal('adj_dir') === 'in'
        ? round2(S.adjust.cur + q)
        : round2(S.adjust.cur - q);
      if (newQty < 0) { toast(t('qtyNeg'), false); return; }
      var body = {
        reason: selVal('adj_reason'),
        notes: 'lite',
        items: [{ product_id: S.adjust.pid, new_qty: newQty }]
      };
      S.busy = true;
      toast(t('saving'), true);
      api('POST', '/api/stock/adjustments', body, function (err, data) {
        S.busy = false;
        if (err) { showErr(err); return; }
        var itm = (data && data.items && data.items[0]) || {};
        toast(t('saved') + ': ' + fmt(itm.previous_qty) + ' → ' + fmt(itm.new_qty), true);
        S.adjust.cur = num(itm.new_qty);
        renderAdjBox();
        loadStockList();
      });
    },

    saveItem: function () {
      if (S.busy) return;
      var name = trim(val('ni_name'));
      if (!name) { toast(t('nameReq'), false); return; }
      var body = {
        name: name,
        selling_price: num(val('ni_sell')),
        purchase_price: num(val('ni_buy')),
        opening_stock: num(val('ni_open')),
        tax_rate: num(val('ni_gst')),
        min_stock: num(val('ni_min'))
      };
      var unitId = selVal('ni_unit');
      if (unitId) body.unit_id = Number(unitId);
      var sku = trim(val('ni_sku'));
      if (sku) body.sku = sku;
      S.busy = true;
      toast(t('saving'), true);
      api('POST', '/api/products', body, function (err, data) {
        S.busy = false;
        if (err) { showErr(err); return; }
        toast(t('itemCreated') + ': ' + (data.name || name), true);
        var ids = ['ni_name', 'ni_sell', 'ni_buy', 'ni_open', 'ni_min', 'ni_sku'];
        for (var i = 0; i < ids.length; i++) { var el = $(ids[i]); if (el) el.value = ''; }
      });
    },

    openBill: function (id) {
      api('GET', '/api/sales/' + Number(id), null, function (err, data) {
        if (err) { showErr(err); return; }
        S.bill = data;
        renderBills($('view'));
      });
    },

    closeBill: function () {
      S.bill = null;
      renderBills($('view'));
    },

    moreBills: function () {
      if (S.billsPage >= S.billsPages) return;
      loadBills(S.billsPage + 1, true);
    }
  };
  window.Lite = Lite;

  /* ----------------------------- boot ------------------------------- */
  renderChrome();
  go('home');
}());
</script>
</body>
</html>
